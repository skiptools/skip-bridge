name: skip-bridge
on:
  push:
    branches: [ main ]
    tags: "[0-9]+.[0-9]+.[0-9]+"
  schedule:
    - cron:  '0 5 * * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  call-workflow:
    uses: skiptools/actions/.github/workflows/skip-framework.yml@v1
    with:
      # arm macOS runs iOS and Robolectric; the emulator step is skipped there (no nested virtualization) and runs on Ubuntu
      runs-on: "['macos-26', 'ubuntu-24.04']"
      swift-android-sdk-version: "['', 'nightly-main']"
      # disable export because there are currently problems with shared PCH module cache files with multi-module native export
      run-export: false

